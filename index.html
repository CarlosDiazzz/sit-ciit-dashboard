<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/LogoClaro.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <script>
      try {
        const saved = localStorage.getItem('zenda.color-mode');
        document.documentElement.dataset.colorMode = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.style.colorScheme = saved === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.colorMode = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    </script>
    <title>Zenda - Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
